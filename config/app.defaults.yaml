# Default application settings (checked in). Override with config/app.local.yaml (gitignored).

server:
  host: "127.0.0.1"
  port: 8765

paths:
  # Relative to repository root (--repo-root); runtime creates these as needed.
  data_dir: "data"
  logs_dir: "data/logs"
  thumbnail_cache_dir: "data/thumbnail_cache"
  scan_artifacts_dir: "data/scans"
  user_scans_dir: "user_scans"
  mount_point: "data/iphone_mount"

deletes:
  # Delete non-kept files in chunks to reduce FUSE pressure.
  chunk_size: 40

tools:
  # null means resolve from PATH by basename only (no env-based app config).
  ideviceinfo: null
  idevice_id: null
  ifuse: null

ui:
  open_browser: true
  thumbnail_max_edge: 320
  thumbnail_jpeg_quality: 72
  thumbnail_cache_max_mb: 512
  max_concurrent_thumbnails: 3
  sse_poll_interval_ms: 5000
  # Duplicate review loads this many groups per page (large libraries may have thousands of groups).
  groups_page_size: 30
  # Thumbnails per page in document/delete confirmation dialogs.
  preview_page_size: 24
  # Photos shown at once inside one duplicate group (sub-pages when group is larger).
  images_per_group_page: 12
  # Thumbnails in the review overlay (larger = easier comparison; still capped per request).
  review_thumbnail_max_edge: 1024
  # How often to log walk progress while listing images from the phone.
  walk_progress_every: 250

duplicates:
  auto_best:
    face_eye: false
    # Only the first N files in each group run the heavier face/eye path (when face_eye is true).
    face_eye_max_images_per_group: 6
  phash_threshold: 6
  # Fuzzy roll: adjacent photos in capture-time order (bursts + same-scene palette/layout).
  fuzzy_phash_max_hamming: 12
  fuzzy_phash_max_dim: 128
  fuzzy_colorhash_max_hamming: 10
  fuzzy_max_adjacent_gap_sec: 120
  fuzzy_palette_enabled: true
  fuzzy_palette_max_distance: 0.32
  fuzzy_palette_max_color_count_delta: 4
  fuzzy_palette_min_grid_agreement: 0.55
  fuzzy_palette_grid: 16
  fuzzy_fast_path_enabled: true
  fuzzy_grid_exact_match_min: 200
  fuzzy_opencv_palette: false
  # Fuzzy: 0 = hash and analyze the entire library in one run (recommended). Positive = photos per click.
  fuzzy_roll_batch_size: 0
  # "fast" = file date + path (recommended for 10k+ libraries). "exif" = read capture time from every file (slow first run).
  fuzzy_roll_sort: fast
  # Exact duplicate compare chunk size within a size bucket; 0 = no chunking (full pairwise per bucket).
  exact_max_hash_cluster: 0

logging:
  level: "INFO"
